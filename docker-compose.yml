services:
  postgres:
    image: postgres:16-alpine
    container_name: yitong-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yitong
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yitong-network

  redis:
    image: redis:7-alpine
    container_name: yitong-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yitong-network

volumes:
  postgres_data:
  redis_data:

networks:
  yitong-network:
    driver: bridge
