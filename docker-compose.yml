services:
  postgres:
    image: postgres:16-alpine
    container_name: yitong-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yitong
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yitong-network

  redis:
    image: redis:7-alpine
    container_name: yitong-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yitong-network

  minio:
    image: minio/minio:latest
    container_name: yitong-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - yitong-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  yitong-network:
    driver: bridge
