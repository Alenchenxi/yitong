; 时区
date.timezone = Asia/Shanghai

; 上传限制
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; 错误处理（生产环境关闭错误显示）
display_errors = Off
log_errors = On
error_log = /var/www/html/runtime/log/php_error.log

; 会话
session.gc_maxlifetime = 7200
