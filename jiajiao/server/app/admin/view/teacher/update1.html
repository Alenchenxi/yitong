<script>
layui.use(['form'],function(){});
uploader('head_img_upload','head_img','image',false,'','{:getUploadServerUrl()}');
uploader('id_card_zheng_upload','id_card_zheng','image',false,'','{:getUploadServerUrl()}');
uploader('id_card_fan_upload','id_card_fan','image',false,'','{:getUploadServerUrl()}');
uploader('student_card_img_upload','student_card_img','image',false,'','{:getUploadServerUrl()}');
uploader('diploma_img_upload','diploma_img','image',false,'','{:getUploadServerUrl()}');
uploader('itic_img_upload','itic_img','image',false,'','{:getUploadServerUrl()}');
$(function(){$('.chosen').chosen({search_contains: true})})
var CodeInfoDlg = {
	CodeInfoData: {},
	validateFields: {
	 }
}

CodeInfoDlg.collectData = function () {
	this.set('teacher_id').set('head_img').set('name').set('age').set('mobile').set('id_number').set('school').set('specialty').set('subject_id').set('teaching_way').set('city').set('area').set('salary').set('id_card_zheng').set('id_card_fan').set('student_card_img').set('diploma_img').set('itic_img').set('self_desc').set('experience').set('certificate').set('collect_num').set('teach_num').set('yuyue_num').set('avg_score').set('cause').set('offline_num').set('discount');
};

CodeInfoDlg.update = function () {
	 this.clearData();
	 this.collectData();
	 if (!this.validate()) {
	 	return;
	 }
	 var gender = $("input[name = 'gender']:checked").val();
	 var teacher_identity = $("input[name = 'teacher_identity']:checked").val();
	 var teaching_age = $("input[name = 'teaching_age']:checked").val();
	 var is_hide = $("input[name = 'is_hide']:checked").val();
	 var status = $("input[name = 'status']:checked").val();
	 var is_on_off = $("input[name = 'is_on_off']:checked").val();
	 var ajax = new $ax(Feng.ctxPath + "/Teacher/update", function (data) {
	 	if ('00' === data.status) {
	 		Feng.success(data.msg,1000);
	 		window.parent.CodeGoods.table.refresh();
	 		CodeInfoDlg.close();
	 	} else {
	 		Feng.error(data.msg + "！",1000);
		 }
	 })
	 ajax.set('gender',gender);
	 ajax.set('teacher_identity',teacher_identity);
	 ajax.set('teaching_age',teaching_age);
	 ajax.set('is_hide',is_hide);
	 ajax.set('status',status);
	 ajax.set('is_on_off',is_on_off);
	 ajax.set(this.CodeInfoData);
	 ajax.start();
};


</script>
<script src="__PUBLIC__/static/js/base.js" charset="utf-8"></script>
