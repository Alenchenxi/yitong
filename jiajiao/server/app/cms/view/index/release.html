<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width,user-scalable=no" name="viewport">
    <title>学员发布</title>
    <meta name="keywords" content="重庆家教、重庆私教、重庆一对一、重庆补课"/>
    <meta name="description" content="向日葵家教，重庆家教/私教/一对一补课，人人都请得起的家教平台"/>
    <link rel="stylesheet" type="text/css" href="/css/reset.css"/>
    <link rel="stylesheet" type="text/css" href="/css/release.css"/>
    <link rel="stylesheet" type="text/css" href="/static/css/plugins/layui/layui.css"/>
    <link rel="stylesheet" href="https://res.wx.qq.com/open/libs/weui/2.0.1/weui.min.css">
</head>

<body>
<div class="stu_sendpage">
    <form action="#" method="post" class="layui-form contact_from">

        <input type="hidden" name="demand_id" value="{$info.demand_id}">

    <div class="page_content">
        <div class="contact_infobox">
            <div class="phone_box">
                <div class="list_phone_text">
                    <text class="lf_text">联系人:</text>
                    <div class="rf_input">
                        <input type="text" name="linkman" value="{$info.linkman}" class="uni-input-input" placeholder="请输入您的姓名" lay-verify="required">
                    </div>
                </div>
                <div class="list_phone_text">
                    <text class="lf_text">手机号:</text>
                    <div class="rf_input">
                        <input type="number" class="uni-input-input" disabled="disabled" placeholder="请输入您的手机号" name="mobile" value="{$info.mobile?$info.mobile:$user_info.mobile}" lay-verify="required">
                        <!-- <text class="get_num" @click="get_yzmfun">{{time_mest}}</text> -->
                        <!--<text class="get_num" @click="show_set_phone=true">更换电话</text>-->
                    </div>
                </div>

                <div class="list_phone_text">
                    <text class="lf_text">学员性别:</text>
                    <div class="rf_input " onclick="selectGender(1)">
                        <input type="text" class="uni-input-input" placeholder="请选择您的性别" disabled="disabled" id="gender_str" value="{$info.gender_str}">
                        <input type="hidden" name="gender" id="gender" value="{$info.gender}">
                        <!--<select name="gender" lay-verify="required">
                            <option value="">请选择您的性别</option>
                            <option value="1" {if condition="$info.gender eq '1'"}selected{/if}>男</option>
                            <option value="2" {if condition="$info.gender eq '2'"}selected{/if}>女</option>
                            <option value="3" {if condition="$info.gender eq '3'"}selected{/if}>不限</option>
                        </select>-->
                    </div>
                </div>

            </div>


        </div>

        <div class="adres_infobox">
            <div class="set_meabox">
                <div class="phone_box">

                    <div class="chose_selecttwo">
                        <div class="list_select">
                            <text class="select_title">家教科目:</text>
                            <!-- <div class="infobo" @click="subjects_show=true"> -->
                            <div class="infobo" onclick="selectSubject()">
                                <input class="uni-input-input" type="text" disabled="disabled" placeholder="请选择您的家教科目" id="subject_id_str" value="{$info.subject_name}">
                                <input type="hidden" name="subject_id" id="subject_id" value="{$info.subject_id}">
                                <!-- <image src="/img/botm_arrow.png" mode=""></image> -->
                                <!--<select name="subject_id" lay-verify="required">
                                    <option value="">请选择您的家教科目</option>
                                    <option value="1">男</option>
                                    <option value="2">女</option>
                                    <option value="3">不限</option>
                                </select>-->
                            </div>
                        </div>
                    </div>

                    <div class="chose_selecttwo">
                        <div class="list_select">
                            <text class="select_title">家教区域:</text>
                            <div class="infobo" onclick="selectArea()">
                                <input class="uni-input-input" type="text" disabled="disabled" placeholder="请选择您的家教区域" id="area_str" value="{$info.area}">
                                <input type="hidden" name="area" id="area" value="{$info.area}">
                                <!-- <image src="/img/botm_arrow.png" mode=""></image> -->
                                <!--<select name="area" lay-verify="required">
                                    <option value="">请选择您的家教区域</option>
                                    {volist name="$param_list.area_list" id="vo"}
                                    <option value="{$vo.name}" {if condition="$info.area eq $vo.name"}selected{/if}>{$vo.name}</option>
                                    {/volist}
                                </select>-->
                            </div>
                        </div>
                    </div>

                    <div class="list_phone_text">
                        <text class="lf_text">详细地址:</text>
                        <div class="rf_input">
                            <input type="text" placeholder="请填写您的详细地址" class="uni-input-input" name="address" value="{$info.address}" lay-verify="required">
                        </div>
                    </div>
                    <div class="list_areabox">
                        <text class="lf_text">学员概况:</text>
                        <div class="rf_areabox">
                                <textarea class="uni-textarea-textarea" name="gai_kuang"  placeholder="请描述一下学员情况，如就读年级、学习成绩等">{$info.gai_kuang}</textarea>
                        </div>
                    </div>


                    <div class="list_phone_text">
                        <text class="lf_text">家教费用:</text>
                        <div class="rf_input" onclick="selectSalary()">
                            <input type="text" disabled="disabled" placeholder="请选择您的家教费用" class="uni-input-input" id="teach_fee_id_str" value="{$info.fee_set}">
                            <input type="hidden"  name="expense" id="teach_fee_id" value="{$info.fee_set}">
                            <!--<select name="teach_fee_id" lay-verify="required">
                                <option value="">请选择您的家教费用</option>
                                {volist name="$param_list.teach_fee_list" id="vo"}
                                <option value="{$vo.teach_fee_id}" {if condition="$info.teach_fee_id eq $vo.teach_fee_id"}selected{/if}>{$vo.fee_set}</option>
                                {/volist}
                            </select>-->

                        </div>

                    </div>

                    <div class="list_phone_text">
                        <text class="lf_text">家教时间:</text>
                        <div class="rf_input">
                            <input type="text" name="teach_time" value="{$info.teach_time}" placeholder="请填写您的家教时间" class="uni-input-input">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="adres_infobox">
            <div class="set_meabox">
                <div class="phone_box">

                    <div class="chose_selecttwo">
                        <div class="list_select">
                            <text class="select_title">教员性别:</text>
                            <div class="infobo" onclick="selectGender(2)">
                                <input type="text" class="uni-input-input" disabled="disabled"  placeholder="请选择教员性别" id="teacher_gender_str" value="{$info.teacher_gender_str}">
                                <input type="hidden" name="teacher_gender" id="teacher_gender" value="{$info.teacher_gender}">
                                <!-- <image src="/img/botm_arrow.png" mode=""></image> -->
                                <!--<select name="teacher_gender" lay-verify="required">
                                    <option value="">请选择教员性别</option>
                                    <option value="1" {if condition="$info.teacher_gender eq '1'"}selected{/if}>男</option>
                                    <option value="2" {if condition="$info.teacher_gender eq '2'"}selected{/if}>女</option>
                                    <option value="3" {if condition="$info.teacher_gender eq '3'"}selected{/if}>不限</option>
                                </select>-->
                            </div>
                        </div>
                    </div>

                    <div class="chose_selecttwo">
                        <div class="list_select">
                            <text class="select_title">教员身份:</text>
                            <div class="infobo" onclick="selectShenfen()">
                                <input type="text" class="uni-input-input" disabled="disabled" id="teacher_identity_str" placeholder="请选择教员身份" value="{$info.teacher_identity_str}">
                                <input type="hidden" name="teacher_identity" id="teacher_identity" value="{$info.teacher_identity}">
                                <!-- <image src="/img/botm_arrow.png" mode=""></image> -->
                                <!--//大学生教员|1|primary,普通教员|2|success,专业教员|3|danger,不限|4|info-->
                                <!--<select name="teacher_identity" lay-verify="required">
                                    <option value="">请选择教员身份</option>
                                    <option value="1" {if condition="$info.teacher_identity eq '1'"}selected{/if}>大学生教员</option>
                                    <option value="2" {if condition="$info.teacher_identity eq '2'"}selected{/if}>普通教员</option>
                                    <option value="3" {if condition="$info.teacher_identity eq '3'"}selected{/if}>专业教员</option>
                                    <option value="4" {if condition="$info.teacher_identity eq '4'"}selected{/if}>不限</option>
                                </select>-->
                            </div>
                        </div>
                    </div>

                    <div class="list_areabox">
                        <text class="lf_text">教员要求:</text>
                        <div class="rf_areabox">
                                <textarea class="uni-textarea-textarea" name="teacher_require" placeholder="请描述一下对教员的要求，如大学生家教、有经验等">{$info.teacher_require}</textarea>
                        </div>
                    </div>


                </div>
            </div>
        </div>
        <div class="submit_btnbox">
            <button type="button"  lay-submit="" lay-filter="submitMsg">确认提交</button>
        </div>
    </div>
    </form>

    <u-popup v-model="subject_popup" mode='bottom' :safe-area-inset-bottom='false'>
        <div class="subject_popbox" style="display:none">
            <!-- <text class="subjuc_title">阶段</text> -->
            <div class="tab_container">
                <div :class="subject_num==i?'list_tab active_border':'list_tab'"
                     v-for="(item,i) in subject_popdatalist" @click="choose_activeobject(i)">
                    <text>{{item.name}}</text>
                </div>

            </div>
            <div class="bottom_sure">
                <button @click="get_objecttwobtn">确定</button>
            </div>
        </div>
    </u-popup>

    <u-popup v-model="show_set_phone" mode='center' width='88%' border-radius='16'>
        <div class="set_phonepopbox" style="display:none">
            <div class="head_title">
                <text>手机号修改</text>
            </div>
            <div class="list_setphoenbox">
                <text class="lf_title">手机号：</text>
                <div class="set_phoneinput">
                    <input type="number" placeholder="请输入手机号"
                           maxlength="11" v-model="set_phone">
                    <text class="get_num" @click="get_yzmfun">{{time_mest}}</text>
                </div>
            </div>
            <div class="list_setphoenbox">
                <text class="lf_title">验证码：</text>
                <div class="set_phoneinput">
                    <input type="number" placeholder="请输入验证码"
                           v-model="yzm_text">
                </div>
            </div>

            <div class="phone_btnbox">
                <button @click="set_userphoen">立即修改</button>
            </div>

        </div>
    </u-popup>


    <!-- 学员性别 -->
    <u-picker mode="selector" v-model="student_sexshow" confirm-color='#fbcab1' @confirm='studengsex_chosefun'
              :range="student_sexlist"></u-picker>
    <!-- 家教科目 -->
    <u-picker mode="selector" v-model="subjects_show" confirm-color='#fbcab1' @confirm='subjects_chosefun'
              :range="subjects_list"></u-picker>
    <!--家教区域 -->
    <u-picker mode="selector" v-model="region" confirm-color='#fbcab1' @confirm='reginon_chosefun'
              :range="region_list"></u-picker>
    <!-- 家教费用 -->
    <u-picker mode="selector" v-model="salary" confirm-color='#fbcab1' @confirm='salary_chosefun'
              :range="salary_list"></u-picker>
    <!-- 选择时间 -->
    <u-picker mode="selector" v-model="education_age" confirm-color='#fbcab1' @confirm='education_chosefun'
              :range="education_age_list"></u-picker>
    <!-- 教员身份 -->
    <u-picker mode="selector" v-model="identity_show" confirm-color='#fbcab1' @confirm='identity_chosefun'
              :range="identity_show_list"></u-picker>
    <!-- 教员性别 -->
    <u-picker mode="selector" v-model="teaher_sexshow" confirm-color='#fbcab1' @confirm='teachersex_chosefun'
              :range="teaher_sexlist"></u-picker>
    <tab-bar :index="2"></tab-bar>




</div>
</body>
{include file="index/footer"}
</html>
<script src="/js/jquery-2.1.1.min.js"></script>
<script src="https://res.wx.qq.com/t/wx_fed/cdn_libs/res/weui/1.2.8/weui.min.js"></script>
<script src="/static/js/plugins/layui/layui.js"></script>
<script type="text/javascript">
    layui.use(['form'], function(){
        var form = layui.form; //只有执行了这一步，部分表单元素才会自动修饰成功
        var $ = layui.$;

        form.on('submit(submitMsg)',function (data) {

            $.ajax({
                url : '/student/studentsRelease',
                type : 'post',
                dataType : 'json',
                data : data.field,
                success : function (res) {
                    console.log(res);
                    if(res.status==200){
                        layer.msg(res.msg,{time: 1000},function(){
                            //window.location.reload();
                            location.href="/user/dsOrder";
                        });
                    }else{
                        layer.msg(res.msg);
                    }
                }
            })
            return false;
        })
    });


    function  selectSubject() {
        $.ajax({
            url : '/index/getSubjectList',
            type : 'post',
            dataType : 'json',
            data : {},
            success : function (res) {
                console.log(res);
                if(res.status==200){
                    // 级联picker
                    weui.picker(res.data, {
                        className: 'custom-classname',
                        container: 'body',
                        defaultValue: [1, 1],
                        onChange: function (result) {
                            console.log(result)
                        },
                        onConfirm: function (result) {
                            console.log(result);

                            //给科目重新赋值
                            $('#subject_id').val(result[1].value);
                            $('#subject_id_str').val(result[1].label);
                        },
                        id: 'doubleLinePicker'
                    });
                }else{
                    layer.msg(res.msg);
                }
            }
        })
    }

    //选择课酬
    function selectSalary(){
        $.ajax({
            url : '/index/getSalaryList',
            type : 'post',
            dataType : 'json',
            data : {},
            success : function (res) {
                console.log(res);
                if(res.status==200){

                    console.log(res.data);
                    weui.picker(
                        res.data,
                        {
                            defaultValue: [res.data[0].value],
                            onChange: function (result) {
                                console.log(result);
                            },
                            onConfirm: function (result) {
                                console.log(result);
                                //给课酬重新赋值
                                $('#teach_fee_id').val(result[0].value);
                                $('#teach_fee_id_str').val(result[0].label);
                            },
                        });
                }else{
                    layer.msg(res.msg);
                }
            }
        })
    }

    //选择性别
    function selectGender(type){
        weui.picker([{
                label: '男',
                value: 1
            }, {
                label: '女',
                value: 2
            }, {
                label: '不限',
                value: 3
            }],
            {
                defaultValue: [1],
                /*onChange: function (result) {
                    console.log(result);
                },*/
                onConfirm: function (result) {
                    console.log(result);

                    if(type==1){
                        //给学生性别重新赋值
                        $('#gender').val(result[0].value);
                        $('#gender_str').val(result[0].label);
                    }else{
                        //给老师性别重新赋值
                        $('#teacher_gender').val(result[0].value);
                        $('#teacher_gender_str').val(result[0].label);
                    }

                },
            });
    }

    //选择身份
    function selectShenfen(){
        weui.picker(
            [{
                label: '大学生教员',
                value: 1
            }, {
                label: '普通教员',
                value: 2
            }, {
                label: '专业教员',
                value: 3
            }, {
                label: '不限',
                value: 4
            }],
            {
                defaultValue: [1],
                onChange: function (result) {
                    console.log(result);
                },
                onConfirm: function (result) {
                    console.log(result);
                    //给身份重新赋值
                    $('#teacher_identity').val(result[0].value);
                    $('#teacher_identity_str').val(result[0].label);
                },
            });
    }

    function selectArea(){
        $.ajax({
            url : '/index/getAreaList',
            type : 'post',
            dataType : 'json',
            data : {},
            success : function (res) {
                console.log(res);
                if(res.status==200){

                    console.log(res.data);
                    weui.picker(
                        res.data,
                        {
                            defaultValue: [res.data[0].value],
                            onChange: function (result) {
                                console.log(result);
                            },
                            onConfirm: function (result) {
                                console.log(result);
                                //给区域重新赋值
                                $('#area').val(result[0].value);
                                $('#area_str').val(result[0].label);

                            },
                        });
                }else{
                    layer.msg(res.msg);
                }
            }
        })
    }


</script>
