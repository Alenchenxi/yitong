# 生产部署 compose（host 网络模式，生产服务器专用变体，已入库跟踪）
# 与 docker-compose.prod.yml（bridge 版，通用部署用）并存；nginx 配套文件为 nginx.host.conf
# 服务器官方部署脚本 COMPOSE_FILE 默认指向本文件；CentOS 7 内核 3.10.0-123 docker bridge
# 宿主->容器 ARP 不通，改 host 网络绕过；所有容器共享宿主网络栈，服务间用 127.0.0.1:端口 互访
services:
  postgres:
    image: postgres:14-alpine
    container_name: yitong-postgres
    restart: always
    security_opt:
      - seccomp:unconfined
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
      POSTGRES_DB: yitong
    volumes:
      - /home/yitongxiaoyuanyun/pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: yitong-redis
    restart: always
    security_opt:
      - seccomp:unconfined
    network_mode: host
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: yitong-minio
    restart: always
    security_opt:
      - seccomp:unconfined
    network_mode: host
    command: server /data --address 127.0.0.1:9000
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env.production}
    volumes:
      - minio_data:/data

  server:
    build:
      context: .
      network: host
    container_name: yitong-server
    restart: always
    security_opt:
      - seccomp:unconfined
    network_mode: host
    env_file: .env.production
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@127.0.0.1:5432/yitong?schema=public
      - REDIS_URL=redis://127.0.0.1:6379
      - CHAT_WS_URL=wss://${DOMAIN}/ws
      - CHAT_WS_PORT=3001
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./apps/server/certs:/app/apps/server/certs:ro

  nginx:
    image: nginx:alpine
    container_name: yitong-nginx
    restart: always
    security_opt:
      - seccomp:unconfined
    network_mode: host
    volumes:
      - ./nginx.host.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  minio_data:
