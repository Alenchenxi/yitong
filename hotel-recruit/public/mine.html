<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>推广业绩查询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #222; min-height: 100vh; }
  .hd { background: linear-gradient(135deg, #1d3f66, #155e4c); color: #fff; text-align: center; padding: 34px 20px 26px; }
  .hd h1 { font-size: 22px; }
  .hd p { font-size: 13px; opacity: .85; margin-top: 4px; }
  .card { background: #fff; border-radius: 12px; padding: 18px; margin: 16px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
  .field input { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; font-size: 15px; background: #fafafa; }
  .field input:focus { outline: none; border-color: #2c9678; }
  .err { color: #d33; font-size: 13px; min-height: 18px; margin-bottom: 6px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 8px; background: #2c9678; color: #fff; font-size: 16px; padding: 11px 0; cursor: pointer; }
  .btn:active { opacity: .85; }
  .btn[disabled] { background: #aaa; }
  .hello { font-size: 14px; color: #666; }
  .hello b { color: #222; font-size: 17px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; margin-top: 14px; }
  .tile { background: #f2f8f5; border-radius: 10px; padding: 14px 4px; }
  .tile b { display: block; font-size: 26px; color: #2c9678; }
  .tile.gold { background: #fdf5ec; }
  .tile.gold b { color: #d9822b; }
  .tile span { font-size: 12px; color: #888; }
  .note { font-size: 12px; color: #999; margin-top: 14px; }
  .back { display: block; text-align: center; color: #2c9678; font-size: 13px; padding-bottom: 30px; }
  @media (min-width: 768px) {
    .card { max-width: 480px; margin: 26px auto; padding: 24px; }
    .hd { padding: 44px 20px 34px; }
    .hd h1 { font-size: 26px; }
    .tile b { font-size: 30px; }
  }
</style>
</head>
<body>
<div class="hd"><h1>推广业绩查询</h1><p>输入你的推广信息，查看实时业绩</p></div>
<div class="card" id="qcard">
  <div class="field"><label>推广码</label><input id="qCode" maxlength="16" placeholder="注册成功时分配，如 ucemm"></div>
  <div class="field"><label>手机号</label><input id="qPhone" type="tel" maxlength="11" inputmode="numeric" placeholder="注册时填写的手机号"></div>
  <div class="err" id="qErr"></div>
  <button class="btn" id="qBtn">查询业绩</button>
</div>
<div class="card" id="rcard" style="display:none">
  <div class="hello">你好，<b id="rName"></b>，以下为你的实时推广业绩：</div>
  <div class="tiles">
    <div class="tile"><b id="rVisits">-</b><span>链接访问</span></div>
    <div class="tile gold"><b id="rApplies">-</b><span>报名人数</span></div>
    <div class="tile"><b id="rRate">-</b><span>转化率</span></div>
  </div>
  <div class="note">结算以「报名人数」为准。想让更多人报名：打开你的专属链接，点右下角「生成推广海报」保存图片，转发朋友圈和同学群效果最好。</div>
</div>
<a class="back" href="./">« 返回招聘首页</a>
<script>
(function () {
  var code = document.getElementById('qCode'), phone = document.getElementById('qPhone');
  var err = document.getElementById('qErr'), btn = document.getElementById('qBtn');
  try {
    var saved = JSON.parse(localStorage.getItem('myPromo') || 'null');
    if (saved) { code.value = saved.c || ''; phone.value = saved.p || ''; }
  } catch (e) {}
  function query() {
    var c = code.value.trim(), p = phone.value.trim();
    if (!c) { err.textContent = '请填写推广码'; return; }
    err.textContent = '';
    btn.disabled = true; btn.textContent = '查询中…';
    fetch('api/my?code=' + encodeURIComponent(c) + '&phone=' + encodeURIComponent(p))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        btn.disabled = false; btn.textContent = '查询业绩';
        if (!j.ok) { err.textContent = j.msg || '查询失败，请稍后再试'; return; }
        try { localStorage.setItem('myPromo', JSON.stringify({ c: c, p: p })); } catch (e) {}
        document.getElementById('rName').textContent = j.name;
        document.getElementById('rVisits').textContent = j.visits;
        document.getElementById('rApplies').textContent = j.applies;
        document.getElementById('rRate').textContent = j.rate;
        document.getElementById('rcard').style.display = '';
        document.getElementById('rcard').scrollIntoView({ behavior: 'smooth' });
      })
      .catch(function () { btn.disabled = false; btn.textContent = '查询业绩'; err.textContent = '网络异常，请稍后再试'; });
  }
  btn.onclick = query;
  code.addEventListener('keydown', function (e) { if (e.key === 'Enter') query(); });
  phone.addEventListener('keydown', function (e) { if (e.key === 'Enter') query(); });
})();
</script>
</body>
</html>
