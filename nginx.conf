# 燚桐生产 nginx 配置（docker-compose.prod.yml 挂载为 /etc/nginx/conf.d/default.conf）
# TLS 证书：放 ./certs/fullchain.pem + ./certs/privkey.pem（挂载到 /etc/nginx/certs/）
#   - 腾讯云/阿里云免费 DV 证书下载后重命名为这两个文件放入即可
#   - 或用 certbot：先注释 443 块只留 80 + acme-challenge，签发后复制证书到 ./certs/ 再开 443
# 未拿到证书前不要启动 nginx（找不到证书文件会启动失败）。

# 80：Let's Encrypt 验证 + 健康探活 + 跳转 443
server {
    listen 80;
    server_name _;

    # certbot http-01 验证目录
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 云厂商 LB / 监控健康探活（不跳 https，避免探活收到 301）
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # 其余全部跳 443
    location / {
        return 301 https://$host$request_uri;
    }
}

# 443：TLS 反代 API / WS / 文件
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;

    # 视频上传上限 50MB（语音 2MB；余量给 multipart 表单）
    client_max_body_size 50m;

    # API（HTTP 反代到 NestJS :3000）
    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 聊天网关 :3001（wss upgrade）
    location /ws {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # MinIO 文件前端访问（桶 public read；/files/bucket/key -> minio:9000/bucket/key）
    location /files/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
    }

    # 健康检查
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
