# 生产部署 compose（dev 用 docker-compose.yml 仅起 postgres+redis）
# 用法：docker compose -f docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: yitong-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: yitong
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yitong-network

  redis:
    image: redis:7-alpine
    container_name: yitong-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - yitong-network

  server:
    build: .
    container_name: yitong-server
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/yitong?schema=public
      - REDIS_URL=redis://redis:6379
      - CHAT_WS_URL=ws://${DOMAIN:-localhost}:3001
      - CHAT_WS_PORT=3001
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - ADMIN_OPENID=${ADMIN_OPENID:-}
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
      - "3001:3001"
    networks:
      - yitong-network

  nginx:
    image: nginx:alpine
    container_name: yitong-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    networks:
      - yitong-network

volumes:
  postgres_data:
  redis_data:

networks:
  yitong-network:
    driver: bridge
